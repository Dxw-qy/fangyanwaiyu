<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方言与外语互通翻译</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }
        body {
            max-width: 620px;
            margin: 80px auto;
            padding: 0 20px;
        }
        .container {
            background: #f8fafc;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 2px 12px #00000014;
        }
        h2 {
            text-align: center;
            margin-bottom: 26px;
            color: #1e293b;
        }
        #inputWord {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
        }
        #inputWord:focus {
            border-color: #2563eb;
        }
        #searchBtn {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            border: none;
            background-color: #2563eb;
            color: white;
            font-size: 17px;
            border-radius: 10px;
            cursor: pointer;
        }
        #searchBtn:active {
            background-color: #1d4ed8;
        }
        .result-box {
            margin-top: 24px;
            padding: 18px;
            background: #ffffff;
            border-radius: 10px;
            min-height: 80px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>方言翻译查询</h2>
        <input type="text" id="inputWord" placeholder="输入方言词汇，例如：侬">
        <button id="searchBtn">开始查询</button>
        <div class="result-box" id="result">等待查询...</div>
    </div>

<script>
// ==========【这里后面替换成Render给你的后端地址】==========
const BACKEND_URL = "https://xxx.onrender.com";
const API_PATH = "/translate";

const inputEl = document.getElementById("inputWord");
const btnEl = document.getElementById("searchBtn");
const resEl = document.getElementById("result");

btnEl.onclick = async () => {
    const word = inputEl.value.trim();
    if (!word) {
        resEl.innerText = "请输入方言词语！";
        return;
    }
    resEl.innerText = "正在查询...";
    try {
        const resp = await fetch(`${BACKEND_URL}${API_PATH}?word=${encodeURIComponent(word)}`);
        if (!resp.ok) {
            resEl.innerText = "后端请求失败";
            return;
        }
        const text = await resp.text();
        resEl.innerText = text;
    } catch (e) {
        resEl.innerText = "网络错误，请检查后端服务是否正常运行";
        console.error(e);
    }
}
</script>
</body>
</html>
