<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>方言与外语互通翻译 — 示例</title>
  <style>
    body { font-family: system-ui, Arial; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width:100%; height:120px; }
    select, button { margin: 0 .5rem 1rem 0; }
    pre { background:#f7f7f7; padding:1rem; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>方言与外语互通翻译（示例）</h1>
  <label>文本：</label>
  <textarea id="input" placeholder="输入要翻译的文本"></textarea>
  <div>
    <label>从：</label>
    <select id="from">
      <option value="cmn">普通话</option>
      <option value="yue">粤语</option>
      <option value="en">English</option>
    </select>
    <label>到：</label>
    <select id="to">
      <option value="cmn">普通话</option>
      <option value="yue">粤语</option>
      <option value="en">English</option>
    </select>
    <button id="translate">翻译</button>
  </div>
  <h3>结果：</h3>
  <pre id="output">（等待翻译）</pre>

  <script src="script.js"></script>
</body>
</html>
