<!DOCTYPE html>
html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <title>方言外语词典</title>
     <style>
         *{ margin:0; padding:0; box-sizing:border-box; }
         body{
             background:#f0f6ff;
             font-family:"Microsoft Yahei",sans-serif;
             padding:40px 60px;
         }
         h1{ color:#2c4b82; font-size:38px; margin-bottom:20px; }
         .box{
             background:white; padding:25px; border-radius:12px;
             box-shadow:0 2px 10px #ccd8e8; max-width:700px; margin-bottom:20px;
         }
         input{
             width:70%; padding:10px; font-size:17px;
             border:1px solid #99b3d8; border-radius:6px;
         }
         button{
             padding:10px 20px; font-size:17px; background:#2c4b82;
             color:white; border:none; border-radius:6px; cursor:pointer;
         }
         #result{ margin-top:18px; font-size:19px; color:#333; }
         #count{ color:#888; font-size:14px; margin-top:8px; }
         table{ border-collapse:collapse; width:100%; background:white; }
         th,td{ border:1px solid #cfe0f5; padding:8px 10px; text-align:left; }
         th{ background:#2c4b82; color:white; }
         tr:nth-child(even){ background:#f3f8ff; }
     </style>
 </head>
 <body>
     <h1>方言转英文翻译</h1>
     <div class="box">
         <input id="wordInput" placeholder="输入方言词，翻译成英文">
         <button onclick="searchWord()">翻译</button>
         <div id="result"></div>
     </div>
     <div id="count">正在加载词表...</div>
     <table id="dictTable"></table>
 <script>
 let dict = {};
 let words = [];
 fetch('dialect.csv')
     .then(r => r.text())
     .then(text => {
         const lines = text.split('\n').filter(l => l.trim() !== '');
         //跳过表头
         for(let i=1; i<lines.length; i++){
             const parts = lines[i].split(',');
             if(parts.length >=4){
                 const word = parts[0].trim();
                 const phonetic = parts[1].trim();
                 const en = parts[2].trim();
                 const sentence = parts[3].trim();
                 dict[word] = {phonetic, en, sentence};
                 words.push({word, phonetic, en, sentence});
             }
         }
         document.getElementById('count').innerText = `已导入 ${words.length} 个词汇`;
         renderTable(words);
     })
     .catch(err => {
         document.getElementById('count').innerText = '导入失败：检查dialect.csv是否上传';
     });
 // 方言转英文核心查询函数
 function searchWord(){
     const input = document.getElementById('wordInput').value.trim();
     const res = document.getElementById('result');
     if(dict[input]){
         const item = dict[input];
         res.innerText = `方言词【${input}】 → 英文翻译：${item.en}
 音标：${item.phonetic}，例句：${item.sentence}`;
     }else{
         res.innerText = '词库暂无这个方言词汇';
     }
 }
 //渲染4列表格
 function renderTable(data){
     const tb = document.getElementById('dictTable');
     tb.innerHTML = `<tr><th>方言词</th><th>音标</th><th>英文翻译</th><th>例句</th></tr>` +
         data.map(d => `<tr>
             <td>${d.word}</td>
             <td>${d.phonetic}</td>
             <td>${d.en}</td>
             <td>${d.sentence}</td>
         </tr>`).join('');
 }
 </script>
 </body>
 </html>
